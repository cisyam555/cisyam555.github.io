<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">强化学习的交互循环与批量训练更新</title><desc id="desc">环境返回观测，策略生成动作交给环境执行。交互经验存入数据批次，训练算法更新策略参数。执行和训练是不同过程。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#47736c"/></marker></defs>
<rect width="1000" height="560" rx="20" fill="#f6f8f3"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#263f3b">
<text x="50" y="56" font-size="28" font-weight="700">从交互到学习：两条相连的回路</text>
<text x="50" y="90" font-size="17" fill="#526f69">每步都产生经验，积累一批后再训练</text>
<rect x="65" y="175" width="240" height="115" rx="12" fill="#e1eee7" stroke="#90b5a7"/>
<text x="185" y="220" text-anchor="middle" font-size="25" font-weight="700">策略网络</text><text x="185" y="255" text-anchor="middle" font-size="19">根据观测选择动作</text>
<rect x="665" y="175" width="260" height="115" rx="12" fill="#e4edf2" stroke="#9bb3c0"/>
<text x="795" y="220" text-anchor="middle" font-size="25" font-weight="700">环境与执行系统</text><text x="795" y="255" text-anchor="middle" font-size="19">执行动作，产生变化</text>
<g fill="none" stroke="#47736c" stroke-width="3" marker-end="url(#arrow)"><path d="M305 208H653"/><path d="M665 270H317"/></g>
<text x="485" y="190" text-anchor="middle" font-size="20">动作</text><text x="485" y="303" text-anchor="middle" font-size="19">新观测、奖励、结束信息</text>
<rect x="360" y="390" width="280" height="95" rx="12" fill="#f0e8d8" stroke="#c6b58b"/>
<text x="500" y="429" text-anchor="middle" font-size="23" font-weight="700">经验批次与 PPO 更新</text><text x="500" y="463" text-anchor="middle" font-size="18">评估动作效果，调整策略</text>
<g fill="none" stroke="#47736c" stroke-width="3" marker-end="url(#arrow)"><path d="M795 290V438H652"/><path d="M360 438H185V302"/></g>
<text x="813" y="360" font-size="18">保存经验</text><text x="68" y="365" font-size="18">更新参数</text>
<text x="500" y="530" text-anchor="middle" font-size="17" fill="#526f69">部署时通常只进行观测与动作循环，模型参数保持固定</text>
</g></svg>