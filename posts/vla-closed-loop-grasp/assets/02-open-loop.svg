<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">02 / 开环：一次抓空，后面整段都错了</title><desc id="desc">这里说的是任务策略不更新观察；底层关节控制仍然可以有自己的反馈。。关键问题：没有验证“盘子已经在手上”，就进入了搬运阶段。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">02 / 开环：一次抓空，后面整段都错了</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">这里说的是任务策略不更新观察；底层关节控制仍然可以有自己的反馈。</text><rect x="40" y="180" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="214" font-size="21" fill="#397d74" font-weight="600">观察一次</text><text x="58" y="242" font-size="14" fill="#688184" font-weight="400">确认盘子在桌面</text><path d="M268 230L300 230" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="305" y="180" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="323" y="214" font-size="21" fill="#bc754d" font-weight="600">闭合夹爪</text><text x="323" y="242" font-size="14" fill="#688184" font-weight="400">此处实际抓空</text><path d="M533 230L565 230" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="570" y="180" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="588" y="214" font-size="21" fill="#bc754d" font-weight="600">继续搬运</text><text x="588" y="242" font-size="14" fill="#688184" font-weight="400">仍然假设抓取成功</text><path d="M798 230L830 230" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="835" y="180" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="853" y="214" font-size="21" fill="#bc754d" font-weight="600">松开夹爪</text><text x="853" y="242" font-size="14" fill="#688184" font-weight="400">任务最终失败</text><text x="310" y="335" font-size="24" fill="#bc754d" font-weight="600">失败发生后，后续动作仍沿用旧假设</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">关键问题：没有验证“盘子已经在手上”，就进入了搬运阶段。</text></g></svg>