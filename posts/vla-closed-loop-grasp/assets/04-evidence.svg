<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">04 / 如何知道“没抓住”？要看多种证据</title><desc id="desc">夹爪闭合只能证明夹爪状态变化，不能单独证明盘子已经被抓住。。受力可能来自碰撞；图像可能被遮挡。“看不清”不应该被默认当作成功。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">04 / 如何知道“没抓住”？要看多种证据</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">夹爪闭合只能证明夹爪状态变化，不能单独证明盘子已经被抓住。</text><rect x="40" y="145" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="179" font-size="21" fill="#397d74" font-weight="600">图像</text><text x="58" y="207" font-size="14" fill="#688184" font-weight="400">盘子有没有移动？</text><rect x="305" y="145" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="323" y="179" font-size="21" fill="#397d74" font-weight="600">夹爪开口</text><text x="323" y="207" font-size="14" fill="#688184" font-weight="400">手指是否接触物体？</text><rect x="570" y="145" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="588" y="179" font-size="21" fill="#397d74" font-weight="600">力 / 电流（可选）</text><text x="588" y="207" font-size="14" fill="#688184" font-weight="400">是否存在接触或受力？</text><rect x="835" y="145" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="853" y="179" font-size="21" fill="#397d74" font-weight="600">短时间历史</text><text x="853" y="207" font-size="14" fill="#688184" font-weight="400">物体是否持续跟随？</text><rect x="320" y="310" width="460" height="85" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="338" y="344" font-size="21" fill="#397d74" font-weight="600">综合判断：成功 / 失败 / 未知</text><text x="338" y="372" font-size="14" fill="#688184" font-weight="400">单个信号不足时，保留不确定性</text><path d="M152 250L550 305" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M417 250L550 305" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M682 250L550 305" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M947 250L550 305" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">受力可能来自碰撞；图像可能被遮挡。“看不清”不应该被默认当作成功。</text></g></svg>