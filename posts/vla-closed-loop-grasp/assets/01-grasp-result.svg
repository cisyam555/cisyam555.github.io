<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">01 / 动作完成，不代表任务完成</title><desc id="desc">同样是“闭合并抬起”，机器人可能抓空，也可能真正拿起盘子。。机器人与盘子为概念示意；不表示特定夹爪结构或可直接使用的抓取位姿。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">01 / 动作完成，不代表任务完成</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">同样是“闭合并抬起”，机器人可能抓空，也可能真正拿起盘子。</text><path d="M70 160L133 160L190 217L250 217" fill="none" stroke="#719da2" stroke-width="22" stroke-linecap="round"/><circle cx="133" cy="160" r="15" fill="#f4f8f1" stroke="#507e87" stroke-width="4"/><circle cx="190" cy="217" r="13" fill="#f4f8f1" stroke="#507e87" stroke-width="4"/><path d="M250 205v43h18m-18-43h34v43h-12" fill="none" stroke="#264c54" stroke-width="7" stroke-linejoin="round"/><path d="M55 323h310" stroke="#aabeb2" stroke-width="5"/><ellipse cx="318" cy="314" rx="45" ry="10" fill="#e5eceb" stroke="#648993" stroke-width="3"/><path d="M600 160L663 160L720 217L780 217" fill="none" stroke="#719da2" stroke-width="22" stroke-linecap="round"/><circle cx="663" cy="160" r="15" fill="#f4f8f1" stroke="#507e87" stroke-width="4"/><circle cx="720" cy="217" r="13" fill="#f4f8f1" stroke="#507e87" stroke-width="4"/><path d="M780 205v43h18m-18-43h34v43h-12" fill="none" stroke="#264c54" stroke-width="7" stroke-linejoin="round"/><path d="M585 323h310" stroke="#aabeb2" stroke-width="5"/><ellipse cx="797" cy="257" rx="45" ry="10" fill="#e5eceb" stroke="#648993" stroke-width="3"/><text x="78" y="122" font-size="21" fill="#bc754d" font-weight="600">① 指令执行了，盘子没动</text><text x="610" y="122" font-size="21" fill="#397d74" font-weight="600">② 需要验证的是物体结果</text><text x="110" y="383" font-size="23" fill="#bc754d" font-weight="600">夹爪闭合 ≠ 抓取成功</text><text x="645" y="383" font-size="23" fill="#397d74" font-weight="600">物体是否随末端抬起？</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">机器人与盘子为概念示意；不表示特定夹爪结构或可直接使用的抓取位姿。</text></g></svg>