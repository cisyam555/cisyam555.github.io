<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">03 / 闭环：先看结果，再决定下一步</title><desc id="desc">新观察改变策略的输入，任务监测器决定当前阶段是否完成。。闭环提供纠偏机会，但不保证模型一定具备恢复能力。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">03 / 闭环：先看结果，再决定下一步</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">新观察改变策略的输入，任务监测器决定当前阶段是否完成。</text><rect x="40" y="175" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="209" font-size="21" fill="#397d74" font-weight="600">获取新观察</text><text x="58" y="237" font-size="14" fill="#688184" font-weight="400">图像 + 本体状态</text><path d="M268 225L300 225" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="305" y="175" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="323" y="209" font-size="21" fill="#397d74" font-weight="600">预测动作</text><text x="323" y="237" font-size="14" fill="#688184" font-weight="400">VLA 生成动作片段</text><path d="M533 225L565 225" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="570" y="175" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="588" y="209" font-size="21" fill="#397d74" font-weight="600">执行一小段</text><text x="588" y="237" font-size="14" fill="#688184" font-weight="400">接纳前 K 步</text><path d="M798 225L830 225" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="835" y="175" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="853" y="209" font-size="21" fill="#397d74" font-weight="600">验证结果</text><text x="853" y="237" font-size="14" fill="#688184" font-weight="400">成功 / 失败 / 未知</text><path d="M947 277v72H152v-70" fill="none" stroke="#397d74" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="386" font-size="24" fill="#397d74" font-weight="600">把实际结果带回下一次决策</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">闭环提供纠偏机会，但不保证模型一定具备恢复能力。</text></g></svg>