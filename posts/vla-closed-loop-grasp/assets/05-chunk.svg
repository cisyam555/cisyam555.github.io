<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">05 / 预测一串动作，只执行前面一小段</title><desc id="desc">浅色表示预测剩余部分；每轮重新观察后，可以生成新的动作片段。。理想化教学参数，忽略计算与通信等待；行间横向位移仅表示先后轮次，不是等比例时间轴。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">05 / 预测一串动作，只执行前面一小段</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">浅色表示预测剩余部分；每轮重新观察后，可以生成新的动作片段。</text><text x="40" y="175" font-size="17" fill="#264c54" font-weight="400">第 1 轮</text><rect x="100" y="145" width="58" height="43" rx="5" fill="#397d74"/><rect x="163" y="145" width="58" height="43" rx="5" fill="#397d74"/><rect x="226" y="145" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="289" y="145" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="352" y="145" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="415" y="145" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="478" y="145" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="541" y="145" width="58" height="43" rx="5" fill="#d8e4d9"/><text x="108" y="173" font-size="16" fill="#ffffff" font-weight="400">执行 2 步</text><text x="250" y="173" font-size="15" fill="#688184" font-weight="400">其余预测可被下一轮替换</text><text x="40" y="258" font-size="17" fill="#264c54" font-weight="400">第 2 轮</text><rect x="300" y="228" width="58" height="43" rx="5" fill="#397d74"/><rect x="363" y="228" width="58" height="43" rx="5" fill="#397d74"/><rect x="426" y="228" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="489" y="228" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="552" y="228" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="615" y="228" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="678" y="228" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="741" y="228" width="58" height="43" rx="5" fill="#d8e4d9"/><text x="308" y="256" font-size="16" fill="#ffffff" font-weight="400">执行 2 步</text><text x="450" y="256" font-size="15" fill="#688184" font-weight="400">其余预测可被下一轮替换</text><text x="40" y="341" font-size="17" fill="#264c54" font-weight="400">第 3 轮</text><rect x="500" y="311" width="58" height="43" rx="5" fill="#397d74"/><rect x="563" y="311" width="58" height="43" rx="5" fill="#397d74"/><rect x="626" y="311" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="689" y="311" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="752" y="311" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="815" y="311" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="878" y="311" width="58" height="43" rx="5" fill="#d8e4d9"/><rect x="941" y="311" width="58" height="43" rx="5" fill="#d8e4d9"/><text x="508" y="339" font-size="16" fill="#ffffff" font-weight="400">执行 2 步</text><text x="650" y="339" font-size="15" fill="#688184" font-weight="400">其余预测可被下一轮替换</text><text x="835" y="155" font-size="22" fill="#397d74" font-weight="600">H = 8</text><text x="835" y="190" font-size="22" fill="#397d74" font-weight="600">K = 2</text><text x="835" y="225" font-size="20" fill="#264c54" font-weight="400">Δt = 0.1 s</text><text x="835" y="285" font-size="17" fill="#264c54" font-weight="400">预测约 0.8 s</text><text x="835" y="320" font-size="17" fill="#264c54" font-weight="400">先执行约 0.2 s</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">理想化教学参数，忽略计算与通信等待；行间横向位移仅表示先后轮次，不是等比例时间轴。</text></g></svg>