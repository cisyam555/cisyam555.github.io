<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">06 / 失败以后，不是无限重复 Close</title><desc id="desc">恢复动作必须结合真实接触状态；不存在适合所有失败场景的固定退回路线。。停止与恢复应由经过验证的机器人接口执行，不能仅靠模型判断异常。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">06 / 失败以后，不是无限重复 Close</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">恢复动作必须结合真实接触状态；不存在适合所有失败场景的固定退回路线。</text><rect x="40" y="170" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="204" font-size="21" fill="#397d74" font-weight="600">确认失败</text><text x="58" y="232" font-size="14" fill="#688184" font-weight="400">取消不再适用的剩余动作</text><rect x="305" y="170" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="323" y="204" font-size="21" fill="#397d74" font-weight="600">检查恢复条件</text><text x="323" y="232" font-size="14" fill="#688184" font-weight="400">状态有效？还有重试预算？</text><rect x="570" y="170" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="588" y="204" font-size="21" fill="#397d74" font-weight="600">受限恢复</text><text x="588" y="232" font-size="14" fill="#688184" font-weight="400">按场景退回 / 张开 / 调整</text><rect x="835" y="170" width="225" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="853" y="204" font-size="21" fill="#397d74" font-weight="600">重新观察与预测</text><text x="853" y="232" font-size="14" fill="#688184" font-weight="400">不能盲目重复旧片段</text><path d="M268 220L300 220" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M533 220L565 220" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M798 220L830 220" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="355" y="325" width="390" height="75" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="373" y="359" font-size="21" fill="#bc754d" font-weight="600">不满足恢复条件 → 停止或接管</text><path d="M417 275L550 320" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">停止与恢复应由经过验证的机器人接口执行，不能仅靠模型判断异常。</text></g></svg>