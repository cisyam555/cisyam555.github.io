<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">07 / 第二次抓住，不等于模型现场学会了</title><desc id="desc">重新推理通常仍然使用同一组模型权重。。恢复能力还依赖训练数据覆盖；单次重试成功不能证明模型发生了在线学习。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">07 / 第二次抓住，不等于模型现场学会了</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">重新推理通常仍然使用同一组模型权重。</text><rect x="65" y="155" width="410" height="95" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="83" y="189" font-size="21" fill="#397d74" font-weight="600">旧观察 → 同一个模型 → 旧动作</text><text x="83" y="217" font-size="14" fill="#688184" font-weight="400">模型参数 θ 保持不变</text><rect x="625" y="155" width="410" height="95" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="643" y="189" font-size="21" fill="#397d74" font-weight="600">新观察 → 同一个模型 → 新动作</text><text x="643" y="217" font-size="14" fill="#688184" font-weight="400">输入改变，输出因此改变</text><path d="M480 205L615 205" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="150" y="330" font-size="24" fill="#397d74" font-weight="600">闭环推理：更新观察和动作计划</text><text x="150" y="380" font-size="23" fill="#bc754d" font-weight="600">在线训练：实际更新模型参数，属于另一件事</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">恢复能力还依赖训练数据覆盖；单次重试成功不能证明模型发生了在线学习。</text></g></svg>