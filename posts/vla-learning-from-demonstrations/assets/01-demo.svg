<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">01 / 示范数据：不只是拍一段视频</title><desc id="desc">人通过遥操作等方式完成任务，同时记录观察、机器人状态、指令与动作。。动作可为关节目标、末端增量等；必须记录其坐标系、单位和控制语义。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">01 / 示范数据：不只是拍一段视频</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">人通过遥操作等方式完成任务，同时记录观察、机器人状态、指令与动作。</text><path d="M70 160L133 160L190 217L250 217" fill="none" stroke="#719da2" stroke-width="22" stroke-linecap="round"/><circle cx="133" cy="160" r="15" fill="#f4f8f1" stroke="#507e87" stroke-width="4"/><circle cx="190" cy="217" r="13" fill="#f4f8f1" stroke="#507e87" stroke-width="4"/><path d="M250 205v43h18m-18-43h34v43h-12" fill="none" stroke="#264c54" stroke-width="7" stroke-linejoin="round"/><path d="M55 323h310" stroke="#aabeb2" stroke-width="5"/><ellipse cx="267" cy="257" rx="45" ry="10" fill="#e5eceb" stroke="#648993" stroke-width="3"/><rect x="460" y="140" width="580" height="80" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="478" y="174" font-size="21" fill="#397d74" font-weight="600">任务指令 ℓ</text><text x="478" y="202" font-size="14" fill="#688184" font-weight="400">“把盘子放进水槽”</text><rect x="460" y="240" width="270" height="90" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="478" y="274" font-size="21" fill="#397d74" font-weight="600">观察 oₜ</text><text x="478" y="302" font-size="14" fill="#688184" font-weight="400">相机图像 / 可选多视角</text><rect x="770" y="240" width="270" height="90" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="788" y="274" font-size="21" fill="#397d74" font-weight="600">状态 sₜ</text><text x="788" y="302" font-size="14" fill="#688184" font-weight="400">关节 / 末端 / 夹爪</text><rect x="460" y="350" width="580" height="65" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="478" y="384" font-size="21" fill="#397d74" font-weight="600">动作 aₜ：示范者下发的控制目标</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">动作可为关节目标、末端增量等；必须记录其坐标系、单位和控制语义。</text></g></svg>