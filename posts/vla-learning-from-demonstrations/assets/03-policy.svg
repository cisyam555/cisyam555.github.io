<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">03 / 模型学什么：给定条件，预测示范动作</title><desc id="desc">视觉语言表征提供感知与语义背景，机器人示范提供动作学习信号。。具体模型的主干、动作头、状态输入及冻结 / 微调范围不同，不是统一固定架构。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">03 / 模型学什么：给定条件，预测示范动作</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">视觉语言表征提供感知与语义背景，机器人示范提供动作学习信号。</text><rect x="40" y="125" width="260" height="80" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="159" font-size="21" fill="#397d74" font-weight="600">图像</text><text x="58" y="187" font-size="14" fill="#688184" font-weight="400">盘子在哪？</text><path d="M305 165L390 265" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="40" y="225" width="260" height="80" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="259" font-size="21" fill="#397d74" font-weight="600">指令</text><text x="58" y="287" font-size="14" fill="#688184" font-weight="400">要把什么放到哪里？</text><path d="M305 265L390 265" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="40" y="325" width="260" height="80" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="359" font-size="21" fill="#397d74" font-weight="600">状态（可选）</text><text x="58" y="387" font-size="14" fill="#688184" font-weight="400">机器人现在处于什么状态？</text><path d="M305 365L390 265" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="400" y="205" width="290" height="120" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="418" y="239" font-size="21" fill="#397d74" font-weight="600">条件动作策略 πθ</text><text x="418" y="267" font-size="14" fill="#688184" font-weight="400">从示范中学习输入与动作关系</text><path d="M695 265L765 265" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="775" y="205" width="285" height="120" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="793" y="239" font-size="21" fill="#397d74" font-weight="600">预测动作 â 或片段 Â</text><text x="793" y="267" font-size="14" fill="#688184" font-weight="400">连续数值或动作 token</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">具体模型的主干、动作头、状态输入及冻结 / 微调范围不同，不是统一固定架构。</text></g></svg>