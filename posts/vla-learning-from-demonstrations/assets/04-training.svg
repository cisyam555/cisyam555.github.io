<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">04 / 行为克隆：用预测误差更新模型</title><desc id="desc">连续回归示例：L = 平均 ‖â − a‖²；训练目标来自动作示范。。这是训练阶段的参数更新；不同动作头会使用不同损失，不能都套用均方误差。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">04 / 行为克隆：用预测误差更新模型</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">连续回归示例：L = 平均 ‖â − a‖²；训练目标来自动作示范。</text><rect x="40" y="160" width="280" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="194" font-size="21" fill="#397d74" font-weight="600">同一份训练输入</text><text x="58" y="222" font-size="14" fill="#688184" font-weight="400">图像 / 指令 / 状态</text><path d="M325 210L390 210" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="400" y="160" width="300" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="418" y="194" font-size="21" fill="#397d74" font-weight="600">策略输出预测 â</text><text x="418" y="222" font-size="14" fill="#688184" font-weight="400">示例：平移、旋转、夹爪</text><path d="M705 210L765 210" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="775" y="160" width="285" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="793" y="194" font-size="21" fill="#397d74" font-weight="600">与示范目标 a 比较</text><text x="793" y="222" font-size="14" fill="#688184" font-weight="400">计算训练损失 L</text><path d="M915 265v88H550v-85" fill="none" stroke="#397d74" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="398" font-size="23" fill="#397d74" font-weight="600">反向传播与优化器更新可训练参数 θ</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">这是