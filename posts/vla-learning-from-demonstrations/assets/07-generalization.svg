<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">07 / 会模仿，不等于能处理所有新情况</title><desc id="desc">自主执行进入的数据分布，可能不同于示范者记录的状态分布。。按轨迹 / 场景划分数据，避免相邻帧泄漏；有针对性地增加数据仍需独立评估。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">07 / 会模仿，不等于能处理所有新情况</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">自主执行进入的数据分布，可能不同于示范者记录的状态分布。</text><rect x="40" y="145" width="300" height="120" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="179" font-size="21" fill="#397d74" font-weight="600">示范覆盖的状态</text><text x="58" y="207" font-size="14" fill="#688184" font-weight="400">标准位置 / 常见接近方式</text><path d="M345 205L395 205" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="405" y="145" width="300" height="120" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="423" y="179" font-size="21" fill="#397d74" font-weight="600">自主执行产生偏差</text><text x="423" y="207" font-size="14" fill="#688184" font-weight="400">滑动 / 遮挡 / 接触失败</text><path d="M710 205L760 205" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="770" y="145" width="290" height="120" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="788" y="179" font-size="21" fill="#397d74" font-weight="600">少见状态下预测失准</text><text x="788" y="207" font-size="14" fill="#688184" font-weight="400">误差可能继续累积</text><text x="115" y="335" font-size="23" fill="#397d74" font-weight="600">训练数据：覆盖扰动与恢复，避免只收集同一路径</text><text x="115" y="390" font-size="23" fill="#397d74" font-weight="600">评估数据：独立场景与轨迹，检查任务成功和泛化</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">按轨迹 / 场景划分数据，避免相邻帧泄漏；有针对性地增加数据仍需独立评估。</text></g></svg>