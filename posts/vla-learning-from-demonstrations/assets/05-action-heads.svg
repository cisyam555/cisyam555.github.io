<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">05 / “模仿动作”可以有不同实现</title><desc id="desc">行为克隆是学习范式，不代表所有 VLA 都用同一种动作头或损失。。RT-2 / OpenVLA 可作为 token 路线阅读；π0 提供流匹配动作生成的具体例子。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">05 / “模仿动作”可以有不同实现</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">行为克隆是学习范式，不代表所有 VLA 都用同一种动作头或损失。</text><rect x="40" y="155" width="300" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="189" font-size="21" fill="#397d74" font-weight="600">离散动作 token</text><text x="58" y="217" font-size="14" fill="#688184" font-weight="400">动作分箱 → 预测符号序列</text><rect x="400" y="155" width="300" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="418" y="189" font-size="21" fill="#397d74" font-weight="600">连续回归</text><text x="418" y="217" font-size="14" fill="#688184" font-weight="400">直接预测归一化动作</text><rect x="760" y="155" width="300" height="100" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="778" y="189" font-size="21" fill="#397d74" font-weight="600">扩散 / 流匹配</text><text x="778" y="217" font-size="14" fill="#688184" font-weight="400">条件生成连续动作片段</text><text x="65" y="310" font-size="20" fill="#397d74" font-weight="600">常见目标：交叉熵</text><text x="425" y="310" font-size="20" fill="#397d74" font-weight="600">常见目标：回归损失</text><text x="785" y="310" font-size="20" fill="#397d74" font-weight="600">目标取决于生成构造</text><text x="155" y="380" font-size="25" fill="#264c54" font-weight="600">都使用示范动作作为监督信息，但建模方式不同</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">RT-2 / OpenVLA 可作为 token 路线阅读；π0 提供流匹配动作生成的具体例子。</text></g></svg>