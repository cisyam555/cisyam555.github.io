<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">06 / 不只学下一步，也可以学一段动作</title><desc id="desc">动作片段监督：Âₜ 对齐 [aₜ, aₜ₊₁, …, aₜ₊H₋₁]。。这里讲训练目标的构造；部署时执行多少步、何时重新预测，是另一组系统设计。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397d74"/></marker></defs><rect width="1100" height="480" rx="16" fill="#f2f6ef"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="40" y="48" font-size="27" fill="#264c54" font-weight="600">06 / 不只学下一步，也可以学一段动作</text><text x="40" y="80" font-size="16" fill="#688184" font-weight="400">动作片段监督：Âₜ 对齐 [aₜ, aₜ₊₁, …, aₜ₊H₋₁]。</text><rect x="300" y="175" width="78" height="65" rx="8" fill="#397d74"/><text x="316" y="215" font-size="20" fill="#fff" font-weight="400">a0</text><rect x="390" y="175" width="78" height="65" rx="8" fill="#397d74"/><text x="406" y="215" font-size="20" fill="#fff" font-weight="400">a1</text><rect x="480" y="175" width="78" height="65" rx="8" fill="#397d74"/><text x="496" y="215" font-size="20" fill="#fff" font-weight="400">a2</text><rect x="570" y="175" width="78" height="65" rx="8" fill="#397d74"/><text x="586" y="215" font-size="20" fill="#fff" font-weight="400">a3</text><rect x="660" y="175" width="78" height="65" rx="8" fill="#d8e7df"/><text x="676" y="215" font-size="20" fill="#264c54" font-weight="400">a4</text><rect x="750" y="175" width="78" height="65" rx="8" fill="#d8e7df"/><text x="766" y="215" font-size="20" fill="#264c54" font-weight="400">a5</text><rect x="840" y="175" width="78" height="65" rx="8" fill="#d8e7df"/><text x="856" y="215" font-size="20" fill="#264c54" font-weight="400">a6</text><rect x="930" y="175" width="78" height="65" rx="8" fill="#d8e7df"/><text x="946" y="215" font-size="20" fill="#264c54" font-weight="400">a7</text><rect x="40" y="160" width="210" height="95" rx="13" fill="#fffef9" stroke="#c6d9ce"/><text x="58" y="194" font-size="21" fill="#397d74" font-weight="600">当前观察 oₜ</text><text x="58" y="222" font-size="14" fill="#688184" font-weight="400">同一时刻的条件输入</text><path d="M255 205L290 205" stroke="#397d74" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M305 265v20h710v-20" fill="none" stroke="#397d74" stroke-width="2"/><text x="450" y="327" font-size="24" fill="#397d74" font-weight="600">未来 H 步示范动作作为训练目标</text><text x="290" y="383" font-size="21" fill="#bc754d" font-weight="600">轨迹末尾不够 H 步：补齐，并屏蔽无效位置</text><text x="40" y="450" font-size="14" fill="#688184" font-weight="400">这里讲训练目标的构造；部署时执行多少步、何时重新预测，是另一组系统设计。</text></g></svg>